<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 动画示例</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #f3f5f4;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .stage {
            width: min(100% - 48px, 680px);
            min-height: 380px;
            display: grid;
            place-items: center;
            border: 1px solid #d9dfdc;
            background-color: #fff;
            background-image: radial-gradient(#d9dfdc 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .box {
            width: 150px;
            height: 150px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            animation: color-and-motion 8s ease-in-out infinite;
        }

        @keyframes color-and-motion {
            0%, 100% {
                background-color: #e4572e;
                border-radius: 8px;
                transform: translateX(-170px) rotate(0deg);
            }
            25% {
                background-color: #f3a712;
                border-radius: 50%;
                transform: translateX(0) rotate(90deg);
            }
            50% {
                background-color: #2e86ab;
                border-radius: 8px;
                transform: translateX(170px) rotate(180deg);
            }
            75% {
                background-color: #6a994e;
                border-radius: 50%;
                transform: translateX(0) rotate(270deg);
            }
        }

        @media (max-width: 480px) {
            .stage {
                min-height: 320px;
            }

            .box {
                width: 120px;
                height: 120px;
                animation-name: color-and-motion-small;
            }

            @keyframes color-and-motion-small {
                0%, 100% {
                    background-color: #e4572e;
                    border-radius: 8px;
                    transform: translateX(-90px) rotate(0deg);
                }
                25% {
                    background-color: #f3a712;
                    border-radius: 50%;
                    transform: translateX(0) rotate(90deg);
                }
                50% {
                    background-color: #2e86ab;
                    border-radius: 8px;
                    transform: translateX(90px) rotate(180deg);
                }
                75% {
                    background-color: #6a994e;
                    border-radius: 50%;
                    transform: translateX(0) rotate(270deg);
                }
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .box {
                animation-duration: 16s;
            }
        }
    </style>
</head>
<body>
    <main class="stage" aria-label="CSS 动画展示区域">
        <div class="box">CSS 魏鹏动画</div>
    </main>
</body>
</html>
