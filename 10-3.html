<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>媒体查询改变背景颜色</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html {
			font-size: 14px;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
		}

		.box {
			width: 100%;
			height: 100vh;
			display: grid;
			place-items: center;
			background-color: #e4572e;
			color: #fff;
			font-family: "Microsoft YaHei", sans-serif;
			font-size: 3rem;
			font-weight: 700;
			transition: background-color 300ms ease;
		}

		@media (min-width: 600px) {
			html {
				font-size: 16px;
			}

			.box {
				background-color: #f3a712;
			}
		}

		@media (min-width: 900px) {
			html {
				font-size: 20px;
			}

			.box {
				background-color: #2e86ab;
			}
		}

		@media (min-width: 1200px) {
			html {
				font-size: 24px;
			}

			.box {
				background-color: #6a994e;
			}
		}
	</style>
</head>
<body>
	<main class="box">魏鹏</main>
</body>
</html>
