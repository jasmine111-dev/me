<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.6s;
            box-sizing: border-box;
        }
        .box:first-child:hover{
            background: rgb(228, 9, 177);
            color: white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #18b7e7;
        }
        .box:nth-of-type(4):hover{
            text-shadow: 100px 10px 10px #1308e2;
        }
        .box:nth-of-type(5):hover{
            background: linear-gradient(#e8ec08,#ff7b00,#f00606);
        }
        .box:nth-of-type(5)+.box{
            background: radial-gradient(#fff,#ccc,#000);
        }
        .box:nth-of-type(7):hover{
            transform: scale(0.5);
        }
        .box:nth-child(8):hover{
            transform: translateX(-150px);
        }
        .box:nth-child(9):hover{
            transform: rotateZ(-180deg);
        }
        .box:nth-child(10):hover{
            transform: skewX(20deg) translateY(50px);
        }
        .box:nth-last-child(2):hover::before{
            content: "*";
            color: red;
        }
        .box.box:nth-child(12):hover::after{
            content: "魏鹏";
            display: block;
            padding: 5px 10px;
            font-size: 16px;
            background-color: lightblue; 
            color: yellow;
        }
        .box:nth-child(3n):hover{
            border: 3px solid red;
        }
        .box:nth-child(even):hover{
            border: 3px solid rgb(237, 21, 118);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
